name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select the single production operation to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - c0b-read-only
      expected_sha:
        description: Exact 40-character commit SHA required for C0-B collection
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROD_HOST: 100.66.226.12
  PROD_USER: ubuntu
  PROD_JAR_PATH: /opt/trading/app/trading.jar
  ADMIN_DASHBOARD_DIR: frontend/admin-dashboard
  ADMIN_DASHBOARD_ROOT: /opt/trading/admin-dashboard
  ADMIN_DASHBOARD_URL: http://100.66.226.12:18081

jobs:
  reject-unsupported-route:
    name: Reject unsupported production route
    if: >-
      ${{
        !(
          github.event_name == 'workflow_dispatch' &&
          (
            (github.ref == 'refs/heads/master' && inputs.operation == 'deploy') ||
            (
              github.repository == 'ksi2564/systematic-trading' &&
              github.ref == 'refs/heads/codex/v2-cutover-foundation' &&
              inputs.operation == 'c0b-read-only' &&
              inputs.expected_sha == github.sha &&
              github.actor == 'ksi2564' &&
              github.triggering_actor == 'ksi2564'
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject fail-closed
        run: |
          echo "The selected operation is not allowed on this ref."
          exit 1

  deploy:
    name: Build and deploy production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master' &&
        inputs.operation == 'deploy'
      }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Require master branch
        if: github.ref_name != 'master'
        run: |
          echo "Production deploy can only run from master. Current ref: ${GITHUB_REF_NAME}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/admin-dashboard/package-lock.json

      - name: Build and test backend
        run: |
          chmod +x ./gradlew
          ./gradlew test bootJar

      - name: Build and test admin dashboard
        working-directory: ${{ env.ADMIN_DASHBOARD_DIR }}
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Resolve jar metadata
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(ls build/libs/*.jar | grep -v -- '-plain\.jar$' | head -n 1)"
          if [[ -z "${jar_path}" ]]; then
            echo "bootJar output was not found."
            exit 1
          fi
          jar_sha="$(sha256sum "${jar_path}" | awk '{print $1}')"
          deploy_name="trading-${GITHUB_SHA::7}.jar"
          echo "path=${jar_path}" >> "${GITHUB_OUTPUT}"
          echo "sha=${jar_sha}" >> "${GITHUB_OUTPUT}"
          echo "deploy_name=${deploy_name}" >> "${GITHUB_OUTPUT}"
          echo "Built jar: ${jar_path}"
          echo "SHA-256: ${jar_sha}"

      - name: Package admin dashboard
        id: admin_dashboard
        shell: bash
        run: |
          set -euo pipefail
          deploy_name="admin-dashboard-${GITHUB_SHA}.tgz"
          tar -C "${ADMIN_DASHBOARD_DIR}/dist" -czf "${deploy_name}" .
          package_sha="$(sha256sum "${deploy_name}" | awk '{print $1}')"
          echo "path=${deploy_name}" >> "${GITHUB_OUTPUT}"
          echo "sha=${package_sha}" >> "${GITHUB_OUTPUT}"
          echo "deploy_name=${deploy_name}" >> "${GITHUB_OUTPUT}"
          echo "Built admin dashboard package: ${deploy_name}"
          echo "SHA-256: ${package_sha}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: ${{ env.PROD_HOST }}

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/prod_deploy_key
          chmod 600 ~/.ssh/prod_deploy_key
          ssh-keyscan -T 10 -H "${PROD_HOST}" >> ~/.ssh/known_hosts

      - name: Upload jar
        run: |
          scp -i ~/.ssh/prod_deploy_key \
            -o BatchMode=yes \
            "${{ steps.jar.outputs.path }}" \
            "${PROD_USER}@${PROD_HOST}:/tmp/${{ steps.jar.outputs.deploy_name }}"

      - name: Upload admin dashboard
        run: |
          scp -i ~/.ssh/prod_deploy_key \
            -o BatchMode=yes \
            "${{ steps.admin_dashboard.outputs.path }}" \
            "${PROD_USER}@${PROD_HOST}:/tmp/${{ steps.admin_dashboard.outputs.deploy_name }}"

      - name: Install jar and restart service
        shell: bash
        run: |
          set -euo pipefail
          remote_jar="/tmp/${{ steps.jar.outputs.deploy_name }}"
          ssh -i ~/.ssh/prod_deploy_key \
            -o BatchMode=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo bash -s -- '${remote_jar}' '${PROD_JAR_PATH}'" <<'REMOTE'
          set -euo pipefail
          remote_jar="$1"
          prod_jar_path="$2"
          ts="$(date +%Y%m%d-%H%M%S)"
          cp -a "${prod_jar_path}" "${prod_jar_path}.${ts}.bak"
          install -o trading -g trading -m 0644 "${remote_jar}" "${prod_jar_path}"
          systemctl restart trading
          systemctl is-active --quiet trading
          REMOTE

      - name: Install admin dashboard and reload Caddy
        shell: bash
        run: |
          set -euo pipefail
          remote_package="/tmp/${{ steps.admin_dashboard.outputs.deploy_name }}"
          ssh -i ~/.ssh/prod_deploy_key \
            -o BatchMode=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo bash -s -- '${remote_package}' '${ADMIN_DASHBOARD_ROOT}' '${GITHUB_SHA}' '${{ steps.admin_dashboard.outputs.sha }}'" <<'REMOTE'
          set -euo pipefail
          remote_package="$1"
          deploy_root="$2"
          release_id="$3"
          expected_sha="$4"

          if [ "${deploy_root}" != "/opt/trading/admin-dashboard" ]; then
            echo "Unexpected admin dashboard deploy root: ${deploy_root}"
            exit 1
          fi

          actual_sha="$(sha256sum "${remote_package}" | awk '{print $1}')"
          echo "${actual_sha}  ${remote_package}"
          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "Admin dashboard package SHA-256 mismatch. expected=${expected_sha} actual=${actual_sha}"
            exit 1
          fi

          install -d -o trading -g trading -m 0755 "${deploy_root}" "${deploy_root}/releases"
          release_dir="${deploy_root}/releases/${release_id}"
          tmp_release_dir="${release_dir}.tmp"
          rm -rf "${tmp_release_dir}"
          install -d -o trading -g trading -m 0755 "${tmp_release_dir}"
          tar -xzf "${remote_package}" -C "${tmp_release_dir}"
          chown -R trading:trading "${tmp_release_dir}"

          if [ -e "${release_dir}" ]; then
            mv "${release_dir}" "${release_dir}.$(date +%Y%m%d-%H%M%S).bak"
          fi
          mv "${tmp_release_dir}" "${release_dir}"
          ln -sfn "${release_dir}" "${deploy_root}/current.next"
          mv -Tf "${deploy_root}/current.next" "${deploy_root}/current"

          caddy validate --config /etc/caddy/Caddyfile
          systemctl reload caddy
          systemctl is-active --quiet caddy
          REMOTE

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/prod_deploy_key \
            -o BatchMode=yes \
            "${PROD_USER}@${PROD_HOST}" \
            "sudo bash -s -- '${PROD_JAR_PATH}' '${{ steps.jar.outputs.sha }}' '${ADMIN_DASHBOARD_URL}'" <<'REMOTE'
          set -euo pipefail
          prod_jar_path="$1"
          expected_sha="$2"
          admin_dashboard_url="$3"
          . /etc/trading/trading.env

          echo SERVICE_STATUS
          systemctl is-active trading

          echo JAR_SHA256
          actual_sha="$(sha256sum "${prod_jar_path}" | awk '{print $1}')"
          echo "${actual_sha}  ${prod_jar_path}"
          if [ "${actual_sha}" != "${expected_sha}" ]; then
            echo "Jar SHA-256 mismatch. expected=${expected_sha} actual=${actual_sha}"
            exit 1
          fi

          echo ACTUATOR_HEALTH
          for attempt in $(seq 1 30); do
            if curl -fsS -H "X-API-KEY: ${TRADING_API_KEY}" http://127.0.0.1:8080/actuator/health; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Actuator health did not become ready within 60 seconds."
              exit 1
            fi
            echo "Actuator health is not ready yet. retry=${attempt}/30"
            sleep 2
          done
          echo

          echo OPERATING_MODE
          curl -fsS -H "X-API-KEY: ${TRADING_API_KEY}" http://127.0.0.1:8080/api/operations/mode
          echo

          echo DASHBOARD_SUMMARY
          curl -fsS -H "X-API-KEY: ${TRADING_API_KEY}" http://127.0.0.1:8080/api/dashboard/summary
          echo

          echo ADMIN_DASHBOARD_HTML
          curl -fsS "${admin_dashboard_url}/" | grep -F 'id="root"'
          echo

          echo ADMIN_DASHBOARD_API_PROXY
          curl -fsS -H "X-API-KEY: ${TRADING_API_KEY}" "${admin_dashboard_url}/api/dashboard/summary"
          echo

          echo HIKARI_WARNING_SCAN
          grep -R "No operations allowed after connection closed" /var/log/trading /opt/trading/app 2>/dev/null || true

          echo RECENT_ERRORS
          journalctl -u trading --since "5 minutes ago" --no-pager \
            | grep -Ei "ERROR|Exception|No operations allowed after connection closed" || true
          REMOTE

  collect-c0b-read-only:
    name: Collect sanitized C0-B evidence (read-only)
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'ksi2564/systematic-trading' &&
        github.ref == 'refs/heads/codex/v2-cutover-foundation' &&
        inputs.operation == 'c0b-read-only' &&
        inputs.expected_sha == github.sha &&
        github.actor == 'ksi2564' &&
        github.triggering_actor == 'ksi2564'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      actions: read
      contents: read
    outputs:
      archive_b64_0: ${{ steps.c0b_transport.outputs.archive_b64_0 }}
      archive_b64_1: ${{ steps.c0b_transport.outputs.archive_b64_1 }}
      archive_b64_2: ${{ steps.c0b_transport.outputs.archive_b64_2 }}
      archive_b64_3: ${{ steps.c0b_transport.outputs.archive_b64_3 }}
      archive_sha256: ${{ steps.c0b_transport.outputs.archive_sha256 }}
      archive_bytes: ${{ steps.c0b_transport.outputs.archive_bytes }}
      archive_b64_chars: ${{ steps.c0b_transport.outputs.archive_b64_chars }}
      source_run_attempt: ${{ steps.c0b_transport.outputs.source_run_attempt }}
      transport_nonce: ${{ steps.c0b_transport.outputs.transport_nonce }}
    env:
      BASH_ENV: /dev/null
      C0B_TOOL_COMMIT: abfacaea9b6f5fb1b3a755b18c10785ea104580a
      C0B_TOOL_PARENT: 99605edfefc58e76144e842a930a7d62af61e48a
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GIT_NO_REPLACE_OBJECTS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SELECTED_OPERATION: ${{ inputs.operation }}

    steps:
      - name: Checkout pinned collection commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authorization and create the locked tool worktree
        shell: bash
        run: |
          set -euo pipefail

          expected_tool_commit=abfacaea9b6f5fb1b3a755b18c10785ea104580a
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" \
            || "${GITHUB_REPOSITORY}" != "ksi2564/systematic-trading" \
            || "${GITHUB_REF}" != "refs/heads/codex/v2-cutover-foundation" \
            || "${SELECTED_OPERATION}" != "c0b-read-only" \
            || "${GITHUB_ACTOR}" != "ksi2564" \
            || "${GITHUB_TRIGGERING_ACTOR}" != "ksi2564" \
            || "${GITHUB_RUN_ATTEMPT}" != "1" \
            || "${C0B_TOOL_COMMIT}" != "${expected_tool_commit}" \
            || "${C0B_TOOL_PARENT}" != 99605edfefc58e76144e842a930a7d62af61e48a ]]; then
            echo "C0-B collection authorization context is not allowed."
            exit 1
          fi

          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ \
            || "${EXPECTED_SHA}" != "${GITHUB_SHA}" \
            || "$(git --no-replace-objects rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "C0-B collection requires an exact, lowercase 40-character commit pin."
            exit 1
          fi

          git --no-replace-objects cat-file -e "${C0B_TOOL_COMMIT}^{commit}"
          git --no-replace-objects cat-file -e "${C0B_TOOL_PARENT}^{commit}"
          read -r -a tool_commit_and_parents <<<"$(
            git --no-replace-objects rev-list --parents -n 1 "${C0B_TOOL_COMMIT}"
          )"
          mapfile -t tool_commit_paths < <(
            git --no-replace-objects diff --name-only \
              "${C0B_TOOL_PARENT}" "${C0B_TOOL_COMMIT}"
          )
          expected_tool_commit_paths=(
            .github/scripts/c0b/collect_remote.sh
            .github/scripts/c0b/contract.py
            .github/scripts/c0b/test_c0b_tools.py
          )
          if [[ "${#tool_commit_and_parents[@]}" -ne 2 \
            || "${tool_commit_and_parents[0]}" != "${C0B_TOOL_COMMIT}" \
            || "${tool_commit_and_parents[1]}" != "${C0B_TOOL_PARENT}" \
            || "${#tool_commit_paths[@]}" -ne "${#expected_tool_commit_paths[@]}" ]]; then
            echo "The audited transport tool commit ancestry is invalid."
            exit 1
          fi
          for index in "${!expected_tool_commit_paths[@]}"; do
            if [[ "${tool_commit_paths[index]}" != "${expected_tool_commit_paths[index]}" ]]; then
              echo "The transport tool commit changed an unexpected path."
              exit 1
            fi
          done
          read -r -a commit_and_parents <<<"$(
            git --no-replace-objects rev-list --parents -n 1 "${GITHUB_SHA}"
          )"
          if [[ "${#commit_and_parents[@]}" -ne 2 \
            || "${commit_and_parents[0]}" != "${GITHUB_SHA}" \
            || "${commit_and_parents[1]}" != "${C0B_TOOL_COMMIT}" ]]; then
            echo "The collection workflow commit must directly follow the audited tool commit."
            exit 1
          fi
          mapfile -t lock_commit_paths < <(
            git --no-replace-objects diff --name-only \
              "${C0B_TOOL_COMMIT}" "${GITHUB_SHA}"
          )
          if [[ "${#lock_commit_paths[@]}" -ne 1 \
            || "${lock_commit_paths[0]}" != ".github/workflows/deploy-prod.yml" ]]; then
            echo "The workflow lock commit must change only the production workflow."
            exit 1
          fi

          if ! git --no-replace-objects diff --no-ext-diff --quiet \
              "${C0B_TOOL_COMMIT}" "${GITHUB_SHA}" -- .github/scripts/c0b \
            || [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]] \
            || [[ -e docs/v2-cutover/evidence/c0b ]]; then
            echo "The current checkout violates the audited collection boundary."
            exit 1
          fi

          locked_root="${RUNNER_TEMP}/c0b-tool"
          if [[ -e "${locked_root}" || -L "${locked_root}" ]]; then
            echo "The locked tool worktree path already exists."
            exit 1
          fi
          git --no-replace-objects worktree add --detach \
            "${locked_root}" "${C0B_TOOL_COMMIT}" >/dev/null

          expected_tools=(
            .github/scripts/c0b/build_evidence.py
            .github/scripts/c0b/collect_remote.sh
            .github/scripts/c0b/contract.py
            .github/scripts/c0b/known_deployments.json
            .github/scripts/c0b/sanitize_capture.py
            .github/scripts/c0b/test_c0b_tools.py
            .github/scripts/c0b/transport_bundle.py
            .github/scripts/c0b/validate_evidence.py
          )
          mapfile -t observed_tools < <(
            git --no-replace-objects ls-tree -r --name-only \
              "${C0B_TOOL_COMMIT}" -- .github/scripts/c0b
          )
          if [[ "${#observed_tools[@]}" -ne "${#expected_tools[@]}" ]]; then
            echo "The audited tool tree contains an unexpected file count."
            exit 1
          fi
          for index in "${!expected_tools[@]}"; do
            if [[ "${observed_tools[index]}" != "${expected_tools[index]}" ]]; then
              echo "The audited tool tree does not match the exact file allowlist."
              exit 1
            fi
            locked_file="${locked_root}/${expected_tools[index]}"
            if [[ ! -f "${locked_file}" || -L "${locked_file}" ]]; then
              echo "An audited tool is not a regular file."
              exit 1
            fi
          done
          if [[ "$(git -C "${locked_root}" --no-replace-objects rev-parse HEAD)" != "${C0B_TOOL_COMMIT}" \
            || -n "$(git -C "${locked_root}" status --porcelain=v1 --untracked-files=all)" \
            || -e "${locked_root}/docs/v2-cutover/evidence/c0b" \
            || -n "$(find "${locked_root}/.github/scripts/c0b" -type l -print -quit)" ]]; then
            echo "The locked tool worktree is not clean and exact."
            exit 1
          fi

          python3 -B -E -S \
            "${locked_root}/v2/infra/tests/verify_c0_gate.py" "${locked_root}"
          bash -n "${locked_root}/.github/scripts/c0b/collect_remote.sh"
          bash "${locked_root}/.github/scripts/c0b/collect_remote.sh" --self-test
          (
            cd "${locked_root}"
            python3 -B -E -S -m unittest discover \
              -s .github/scripts/c0b \
              -p 'test_*.py'
          )
          python3 -B -E -S -m json.tool \
            "${locked_root}/.github/scripts/c0b/known_deployments.json" \
            >/dev/null
          python3 -B -E -S \
            "${locked_root}/.github/scripts/c0b/sanitize_capture.py" --help >/dev/null
          python3 -B -E -S \
            "${locked_root}/.github/scripts/c0b/build_evidence.py" --help >/dev/null
          python3 -B -E -S \
            "${locked_root}/.github/scripts/c0b/validate_evidence.py" bundle --help >/dev/null
          python3 -B -E -S \
            "${locked_root}/.github/scripts/c0b/transport_bundle.py" --help >/dev/null

      - name: Verify GitHub run and pinned deployment provenance
        shell: bash
        env:
          GH_HOST: github.com
          GH_PROMPT_DISABLED: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_run="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"
          if ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .id == $run_id and
                .run_attempt == $run_attempt and
                .event == "workflow_dispatch" and
                .head_branch == "codex/v2-cutover-foundation" and
                .head_sha == $head_sha and
                .path == ".github/workflows/deploy-prod.yml" and
                .actor.login == "ksi2564" and
                .triggering_actor.login == "ksi2564" and
                .repository.full_name == "ksi2564/systematic-trading" and
                (.status == "queued" or .status == "in_progress") and
                .conclusion == null
              ' <<<"${current_run}" >/dev/null; then
            echo "The current GitHub workflow run provenance is invalid."
            exit 1
          fi

          branch_refs="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/refs?per_page=100"
          )"
          if ! jq -e --arg head_sha "${GITHUB_SHA}" '
                type == "array" and
                length < 100 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
                  | length) == 1 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")][0]
                  | .object.type == "commit" and .object.sha == $head_sha)
              ' <<<"${branch_refs}" >/dev/null; then
            echo "The collection branch no longer points to the authorized commit."
            exit 1
          fi

          same_sha_runs="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs" \
              -f event=workflow_dispatch \
              -f head_sha="${GITHUB_SHA}" \
              -f per_page=100
          )"
          if ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .total_count == 1 and
                (.workflow_runs | length) == 1 and
                .workflow_runs[0].id == $run_id and
                .workflow_runs[0].run_attempt == $run_attempt and
                .workflow_runs[0].event == "workflow_dispatch" and
                .workflow_runs[0].head_sha == $head_sha and
                .workflow_runs[0].path == ".github/workflows/deploy-prod.yml"
              ' <<<"${same_sha_runs}" >/dev/null; then
            echo "The workflow commit has a prior or mismatched dispatch history."
            exit 1
          fi

          pinned_deploy_run="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/26564469535"
          )"
          if ! jq -e '
                .id == 26564469535 and
                .run_attempt == 1 and
                .event == "workflow_dispatch" and
                .head_branch == "master" and
                .head_sha == "5510399f8a576efc6450a47a195f0cb61869675e" and
                .path == ".github/workflows/deploy-prod.yml" and
                .status == "completed" and
                .conclusion == "success" and
                .repository.full_name == "ksi2564/systematic-trading"
              ' <<<"${pinned_deploy_run}" >/dev/null; then
            echo "The code-owned production deployment run pin is invalid."
            exit 1
          fi

          latest_successful_deploy="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs" \
              -f branch=master \
              -f event=workflow_dispatch \
              -f status=success \
              -f per_page=1
          )"
          if ! jq -e '
                (.workflow_runs | length) == 1 and
                .workflow_runs[0].id == 26564469535 and
                .workflow_runs[0].head_sha == "5510399f8a576efc6450a47a195f0cb61869675e" and
                .workflow_runs[0].path == ".github/workflows/deploy-prod.yml" and
                .workflow_runs[0].conclusion == "success"
              ' <<<"${latest_successful_deploy}" >/dev/null; then
            echo "A newer successful production deployment exists or the pin is invalid."
            exit 1
          fi

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          ping: ${{ env.PROD_HOST }}
          use-cache: false
          version: 1.94.2

      - name: Prepare read-only SSH
        shell: bash
        env:
          C0B_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          locked_root="${RUNNER_TEMP}/c0b-tool"
          if [[ "${C0B_TOOL_COMMIT}" != abfacaea9b6f5fb1b3a755b18c10785ea104580a \
            || "$(git --no-replace-objects rev-parse HEAD)" != "${GITHUB_SHA}" \
            || "$(git -C "${locked_root}" --no-replace-objects rev-parse HEAD)" != "${C0B_TOOL_COMMIT}" \
            || -n "$(git status --porcelain=v1 --untracked-files=all)" \
            || -n "$(git -C "${locked_root}" status --porcelain=v1 --untracked-files=all)" \
            || -e docs/v2-cutover/evidence/c0b \
            || ! -f "${locked_root}/.github/scripts/c0b/collect_remote.sh" \
            || -L "${locked_root}/.github/scripts/c0b/collect_remote.sh" ]]; then
            echo "The collection tool lock changed before SSH preparation."
            exit 1
          fi
          git --no-replace-objects diff --no-ext-diff --exit-code \
            "${C0B_TOOL_COMMIT}" "${GITHUB_SHA}" -- .github/scripts/c0b

          ssh_dir="${RUNNER_TEMP}/c0b-ssh"
          if [[ -e "${ssh_dir}" || -L "${ssh_dir}" || -z "${C0B_SSH_PRIVATE_KEY}" ]]; then
            echo "The SSH preparation boundary is invalid."
            exit 1
          fi
          install -d -m 700 "${ssh_dir}"
          printf '%s\n' "${C0B_SSH_PRIVATE_KEY}" > "${ssh_dir}/key"
          chmod 600 "${ssh_dir}/key"
          if ! ssh-keyscan -T 10 -H "${PROD_HOST}" \
              > "${ssh_dir}/known_hosts" 2>/dev/null \
            || [[ ! -s "${ssh_dir}/known_hosts" ]]; then
            echo "The production SSH host key could not be read."
            exit 1
          fi
          chmod 600 "${ssh_dir}/known_hosts"

      - name: Collect, sanitize, compare, and build the final bundle
        shell: bash
        env:
          GH_HOST: github.com
          GH_PROMPT_DISABLED: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          locked_root="${RUNNER_TEMP}/c0b-tool"
          locked_tools="${locked_root}/.github/scripts/c0b"
          capture_dir="${RUNNER_TEMP}/c0b-sanitized"
          evidence_dir="${RUNNER_TEMP}/c0b-final"
          ssh_dir="${RUNNER_TEMP}/c0b-ssh"

          if [[ "${C0B_TOOL_COMMIT}" != abfacaea9b6f5fb1b3a755b18c10785ea104580a \
            || "${EXPECTED_SHA}" != "${GITHUB_SHA}" \
            || "$(git --no-replace-objects rev-parse HEAD)" != "${GITHUB_SHA}" \
            || "$(git -C "${locked_root}" --no-replace-objects rev-parse HEAD)" != "${C0B_TOOL_COMMIT}" \
            || -n "$(git status --porcelain=v1 --untracked-files=all)" \
            || -n "$(git -C "${locked_root}" status --porcelain=v1 --untracked-files=all)" \
            || -e docs/v2-cutover/evidence/c0b \
            || -e "${capture_dir}" || -L "${capture_dir}" \
            || -e "${evidence_dir}" || -L "${evidence_dir}" \
            || ! -f "${ssh_dir}/key" || -L "${ssh_dir}/key" \
            || ! -f "${ssh_dir}/known_hosts" || -L "${ssh_dir}/known_hosts" ]]; then
            echo "The collection boundary changed before the read-only SSH command."
            exit 1
          fi
          git --no-replace-objects diff --no-ext-diff --exit-code \
            "${C0B_TOOL_COMMIT}" "${GITHUB_SHA}" -- .github/scripts/c0b

          branch_refs="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/refs?per_page=100"
          )"
          current_run="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"
          same_sha_runs="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs" \
              -f event=workflow_dispatch \
              -f head_sha="${GITHUB_SHA}" \
              -f per_page=100
          )"
          if ! jq -e --arg head_sha "${GITHUB_SHA}" '
                type == "array" and
                length < 100 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
                  | length) == 1 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")][0]
                  | .object.type == "commit" and .object.sha == $head_sha)
              ' <<<"${branch_refs}" >/dev/null \
            || ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .id == $run_id and
                .run_attempt == $run_attempt and
                .event == "workflow_dispatch" and
                .head_branch == "codex/v2-cutover-foundation" and
                .head_sha == $head_sha and
                .path == ".github/workflows/deploy-prod.yml" and
                .actor.login == "ksi2564" and
                .triggering_actor.login == "ksi2564" and
                .repository.full_name == "ksi2564/systematic-trading" and
                .status == "in_progress" and
                .conclusion == null
              ' <<<"${current_run}" >/dev/null \
            || ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .total_count == 1 and
                (.workflow_runs | length) == 1 and
                .workflow_runs[0].id == $run_id and
                .workflow_runs[0].run_attempt == $run_attempt and
                .workflow_runs[0].head_sha == $head_sha
              ' <<<"${same_sha_runs}" >/dev/null; then
            echo "The one-shot workflow binding changed before production SSH."
            exit 1
          fi

          captured_at="$(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S+09:00')"
          set +e
          ssh -F /dev/null \
              -i "${ssh_dir}/key" \
              -o BatchMode=yes \
              -o CanonicalizeHostname=no \
              -o ClearAllForwardings=yes \
              -o ConnectionAttempts=1 \
              -o ConnectTimeout=10 \
              -o ExitOnForwardFailure=yes \
              -o ForwardAgent=no \
              -o ForwardX11=no \
              -o GlobalKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes \
              -o KbdInteractiveAuthentication=no \
              -o LogLevel=ERROR \
              -o NumberOfPasswordPrompts=0 \
              -o PasswordAuthentication=no \
              -o PermitLocalCommand=no \
              -o PreferredAuthentications=publickey \
              -o RequestTTY=no \
              -o ServerAliveCountMax=2 \
              -o ServerAliveInterval=15 \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=${ssh_dir}/known_hosts" \
              "${PROD_USER}@${PROD_HOST}" \
              'sudo -n /bin/bash --noprofile --norc -s' \
              < "${locked_tools}/collect_remote.sh" \
              2>/dev/null \
            | python3 -B -E -S "${locked_tools}/sanitize_capture.py" \
              --output-dir "${capture_dir}" \
              --captured-at "${captured_at}" \
              --collector github-actions-prod-read-only \
              --workflow-sha "${GITHUB_SHA}" \
              --workflow-run-id "${GITHUB_RUN_ID}" \
              --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --repository-root "${locked_root}" \
              --decision-file "${locked_root}/docs/v2-cutover/C0_DECISIONS.md" \
              --known-deployments "${locked_tools}/known_deployments.json" \
              >/dev/null
          pipeline_status=("${PIPESTATUS[@]}")
          set -e

          if [[ "${#pipeline_status[@]}" -ne 2 ]]; then
            echo "C0-B collection pipeline status is unavailable."
            exit 1
          fi

          ssh_status="${pipeline_status[0]}"
          sanitizer_status="${pipeline_status[1]}"
          case "${ssh_status}" in
            0) ;;
            41) echo "C0-B remote host prerequisite validation failed." ;;
            42) echo "C0-B remote service or release inspection failed." ;;
            43) echo "C0-B remote effective configuration derivation failed." ;;
            44) echo "C0-B remote initial database read failed." ;;
            45) echo "C0-B remote database stability read failed." ;;
            46) echo "C0-B remote host stability check failed." ;;
            47) echo "C0-B remote protocol emission failed." ;;
            141) echo "C0-B SSH stdout pipe closed after downstream rejection." ;;
            255) echo "C0-B SSH transport or authentication failed." ;;
            *) echo "C0-B remote command failed before a diagnostic phase was available." ;;
          esac
          if [[ "${sanitizer_status}" != 0 ]]; then
            echo "C0-B sanitizer rejected the SSH stdout stream."
          fi
          if [[ "${ssh_status}" != 0 || "${sanitizer_status}" != 0 ]]; then
            exit 1
          fi

          python3 -B -E -S "${locked_tools}/validate_evidence.py" captures \
            --capture-dir "${capture_dir}" \
            --captured-at "${captured_at}" \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --repository-root "${locked_root}" \
            --decision-file "${locked_root}/docs/v2-cutover/C0_DECISIONS.md" \
            --known-deployments "${locked_tools}/known_deployments.json" \
            >/dev/null

          snapshot_at="$(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S+09:00')"
          compared_at="$(TZ=Asia/Seoul date '+%Y-%m-%dT%H:%M:%S+09:00')"
          python3 -B -E -S "${locked_tools}/build_evidence.py" \
            --capture-dir "${capture_dir}" \
            --output-dir "${evidence_dir}" \
            --snapshot-at "${snapshot_at}" \
            --compared-at "${compared_at}" \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --repository-root "${locked_root}" \
            --decision-file "${locked_root}/docs/v2-cutover/C0_DECISIONS.md" \
            --known-deployments "${locked_tools}/known_deployments.json" \
            >/dev/null
          python3 -B -E -S "${locked_tools}/validate_evidence.py" bundle \
            --evidence-dir "${evidence_dir}" \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --repository-root "${locked_root}" \
            --decision-file "${locked_root}/docs/v2-cutover/C0_DECISIONS.md" \
            --known-deployments "${locked_tools}/known_deployments.json" \
            >/dev/null

          if [[ ! -d "${capture_dir}" || -L "${capture_dir}" ]]; then
            echo "The sanitized intermediate directory is invalid."
            exit 1
          fi
          rm -rf -- "${capture_dir}"
          [[ ! -e "${capture_dir}" ]]

          if [[ ! -d "${evidence_dir}" || -L "${evidence_dir}" \
            || "$(find "${evidence_dir}" -type f | wc -l | tr -d ' ')" != 26 \
            || "$(find "${evidence_dir}" -mindepth 1 -type d | wc -l | tr -d ' ')" != 2 \
            || -n "$(find "${evidence_dir}" -type l -print -quit)" \
            || -n "$(find "${evidence_dir}" -type f ! -name '*.json' -print -quit)" ]]; then
            echo "The final sanitized bundle violates the exact artifact boundary."
            exit 1
          fi

      - name: Remove the SSH key before sanitized transport
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="${RUNNER_TEMP}/c0b-ssh"
          if [[ -d "${ssh_dir}" && ! -L "${ssh_dir}" ]]; then
            rm -f -- "${ssh_dir}/key" "${ssh_dir}/known_hosts"
            rmdir -- "${ssh_dir}" 2>/dev/null || true
          elif [[ -e "${ssh_dir}" || -L "${ssh_dir}" ]]; then
            rm -f -- "${ssh_dir}"
          fi
          if [[ -e "${ssh_dir}" || -L "${ssh_dir}" ]]; then
            echo "The collection SSH material was not removed."
            exit 1
          fi

      - name: Revalidate and emit bounded sanitized transport
        id: c0b_transport
        shell: bash
        run: |
          set -euo pipefail

          locked_root="${RUNNER_TEMP}/c0b-tool"
          locked_tools="${locked_root}/.github/scripts/c0b"
          evidence_dir="${RUNNER_TEMP}/c0b-final"
          archive_path="${RUNNER_TEMP}/c0b-final.tar.gz"
          roundtrip_dir="${RUNNER_TEMP}/c0b-roundtrip"
          if [[ "${C0B_TOOL_COMMIT}" != abfacaea9b6f5fb1b3a755b18c10785ea104580a \
            || "${EXPECTED_SHA}" != "${GITHUB_SHA}" \
            || "$(git --no-replace-objects rev-parse HEAD)" != "${GITHUB_SHA}" \
            || "$(git -C "${locked_root}" --no-replace-objects rev-parse HEAD)" != "${C0B_TOOL_COMMIT}" \
            || -n "$(git status --porcelain=v1 --untracked-files=all)" \
            || -n "$(git -C "${locked_root}" status --porcelain=v1 --untracked-files=all)" \
            || -e docs/v2-cutover/evidence/c0b \
            || -e "${RUNNER_TEMP}/c0b-sanitized" \
            || -e "${RUNNER_TEMP}/c0b-ssh" \
            || ! -d "${evidence_dir}" || -L "${evidence_dir}" \
            || -e "${archive_path}" || -L "${archive_path}" \
            || -e "${roundtrip_dir}" || -L "${roundtrip_dir}" ]]; then
            echo "The collection boundary changed before sanitized transport."
            exit 1
          fi
          git --no-replace-objects diff --no-ext-diff --exit-code \
            "${C0B_TOOL_COMMIT}" "${GITHUB_SHA}" -- .github/scripts/c0b
          python3 -B -E -S "${locked_tools}/validate_evidence.py" bundle \
            --evidence-dir "${evidence_dir}" \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --repository-root "${locked_root}" \
            --decision-file "${locked_root}/docs/v2-cutover/C0_DECISIONS.md" \
            --known-deployments "${locked_tools}/known_deployments.json" \
            >/dev/null
          python3 -B -E -S "${locked_tools}/transport_bundle.py" pack \
            --evidence-dir "${evidence_dir}" \
            --archive "${archive_path}" \
            --roundtrip-dir "${roundtrip_dir}" \
            >/dev/null
          python3 -B -E -S "${locked_tools}/validate_evidence.py" bundle \
            --evidence-dir "${roundtrip_dir}" \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --repository-root "${locked_root}" \
            --decision-file "${locked_root}/docs/v2-cutover/C0_DECISIONS.md" \
            --known-deployments "${locked_tools}/known_deployments.json" \
            >/dev/null
          if ! diff -qr --no-dereference "${evidence_dir}" "${roundtrip_dir}" \
              >/dev/null; then
            echo "The sanitized bundle changed during its transport round trip."
            exit 1
          fi
          python3 -B -E -S "${locked_tools}/transport_bundle.py" emit \
            --archive "${archive_path}" \
            --github-output "${GITHUB_OUTPUT}" \
            >/dev/null
          transport_nonce="$(
            python3 -B -E -S -c 'import secrets; print(secrets.token_hex(32))'
          )"
          if [[ ! "${transport_nonce}" =~ ^[0-9a-f]{64}$ \
            || ! "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "The sanitized transport provenance is invalid."
            exit 1
          fi
          echo "source_run_attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "transport_nonce=${transport_nonce}" >> "${GITHUB_OUTPUT}"

      - name: Remove residual collection material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="${RUNNER_TEMP}/c0b-ssh"
          if [[ -d "${ssh_dir}" && ! -L "${ssh_dir}" ]]; then
            rm -f -- "${ssh_dir}/key" "${ssh_dir}/known_hosts"
            rmdir -- "${ssh_dir}" 2>/dev/null || true
          elif [[ -e "${ssh_dir}" || -L "${ssh_dir}" ]]; then
            rm -f -- "${ssh_dir}"
          fi
          for target in \
            "${RUNNER_TEMP}/c0b-sanitized" \
            "${RUNNER_TEMP}/c0b-final" \
            "${RUNNER_TEMP}/c0b-roundtrip"; do
            if [[ -d "${target}" && ! -L "${target}" ]]; then
              rm -rf -- "${target}"
            elif [[ -e "${target}" || -L "${target}" ]]; then
              rm -f -- "${target}"
            fi
          done
          rm -f -- "${RUNNER_TEMP}/c0b-final.tar.gz"
          for target in \
            "${RUNNER_TEMP}/c0b-ssh" \
            "${RUNNER_TEMP}/c0b-sanitized" \
            "${RUNNER_TEMP}/c0b-final" \
            "${RUNNER_TEMP}/c0b-roundtrip" \
            "${RUNNER_TEMP}/c0b-final.tar.gz"; do
            if [[ -e "${target}" || -L "${target}" ]]; then
              echo "Residual collection material was not removed."
              exit 1
            fi
          done

  preserve-c0b-in-git:
    name: Preserve sanitized C0-B evidence in Git
    needs: collect-c0b-read-only
    if: >-
      ${{
        needs['collect-c0b-read-only'].result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        github.repository == 'ksi2564/systematic-trading' &&
        github.ref == 'refs/heads/codex/v2-cutover-foundation' &&
        inputs.operation == 'c0b-read-only' &&
        inputs.expected_sha == github.sha &&
        github.actor == 'ksi2564' &&
        github.triggering_actor == 'ksi2564'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      BASH_ENV: /dev/null
      C0B_TOOL_COMMIT: abfacaea9b6f5fb1b3a755b18c10785ea104580a
      C0B_TOOL_PARENT: 99605edfefc58e76144e842a930a7d62af61e48a
      C0B_SOURCE_RUN_ATTEMPT: ${{ needs['collect-c0b-read-only'].outputs.source_run_attempt }}
      C0B_TRANSPORT_NONCE: ${{ needs['collect-c0b-read-only'].outputs.transport_nonce }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_NO_REPLACE_OBJECTS: "1"
      GIT_TERMINAL_PROMPT: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      SELECTED_OPERATION: ${{ inputs.operation }}

    steps:
      - name: Verify publisher authorization and fetch without persisted credentials
        id: publisher_fetch
        shell: bash
        env:
          GH_HOST: github.com
          GH_PROMPT_DISABLED: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" \
            || "${GITHUB_REPOSITORY}" != "ksi2564/systematic-trading" \
            || "${GITHUB_REF}" != "refs/heads/codex/v2-cutover-foundation" \
            || "${SELECTED_OPERATION}" != "c0b-read-only" \
            || "${GITHUB_ACTOR}" != "ksi2564" \
            || "${GITHUB_TRIGGERING_ACTOR}" != "ksi2564" \
            || "${C0B_TOOL_COMMIT}" != abfacaea9b6f5fb1b3a755b18c10785ea104580a \
            || "${C0B_TOOL_PARENT}" != 99605edfefc58e76144e842a930a7d62af61e48a \
            || ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ \
            || "${EXPECTED_SHA}" != "${GITHUB_SHA}" \
            || ! "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,3}$ \
            || ! "${C0B_SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,3}$ \
            || ! "${C0B_TRANSPORT_NONCE}" =~ ^[0-9a-f]{64}$ \
            || "${C0B_SOURCE_RUN_ATTEMPT}" -gt "${GITHUB_RUN_ATTEMPT}" ]]; then
            echo "C0-B publisher authorization context is not allowed."
            exit 1
          fi

          branch_refs="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/git/refs?per_page=100"
          )"
          current_run="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"
          source_attempt_jobs="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${C0B_SOURCE_RUN_ATTEMPT}/jobs?per_page=100"
          )"
          same_sha_runs="$(
            gh api -H "X-GitHub-Api-Version: 2026-03-10" --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs" \
              -f event=workflow_dispatch \
              -f head_sha="${GITHUB_SHA}" \
              -f per_page=100
          )"
          if ! jq -e '
                type == "array" and
                length < 100 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
                  | length) == 1 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")][0]
                  | .object.type == "commit" and
                    (.object.sha | test("^[0-9a-f]{40}$")))
              ' <<<"${branch_refs}" >/dev/null \
            || ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .id == $run_id and
                .run_attempt == $run_attempt and
                .event == "workflow_dispatch" and
                .head_branch == "codex/v2-cutover-foundation" and
                .head_sha == $head_sha and
                .path == ".github/workflows/deploy-prod.yml" and
                .actor.login == "ksi2564" and
                .triggering_actor.login == "ksi2564" and
                .repository.full_name == "ksi2564/systematic-trading" and
                .status == "in_progress" and
                .conclusion == null
              ' <<<"${current_run}" >/dev/null \
            || ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson source_attempt "${C0B_SOURCE_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .total_count == (.jobs | length) and
                .total_count <= 100 and
                ([.jobs[] | select(
                  .name == "Collect sanitized C0-B evidence (read-only)" and
                  .run_id == $run_id and
                  .run_attempt == $source_attempt and
                  .head_sha == $head_sha and
                  .status == "completed" and
                  .conclusion == "success" and
                  .workflow_name == "Deploy Production"
                )] | length) == 1
              ' <<<"${source_attempt_jobs}" >/dev/null \
            || ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .total_count == 1 and
                (.workflow_runs | length) == 1 and
                .workflow_runs[0].id == $run_id and
                .workflow_runs[0].run_attempt == $run_attempt and
                .workflow_runs[0].head_sha == $head_sha
              ' <<<"${same_sha_runs}" >/dev/null; then
            echo "The publisher workflow binding is invalid."
            exit 1
          fi
          remote_head="$(
            jq -er '
              [.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
              | if length == 1 then .[0].object.sha else empty end
            ' <<<"${branch_refs}"
          )"
          if [[ "${remote_head}" != "${GITHUB_SHA}" \
            && "${GITHUB_RUN_ATTEMPT}" -le "${C0B_SOURCE_RUN_ATTEMPT}" ]]; then
            echo "Only a later failed-job rerun may recover an existing evidence commit."
            exit 1
          fi

          repo_git="${RUNNER_TEMP}/c0b-publisher.git"
          askpass="${RUNNER_TEMP}/c0b-git-askpass"
          if [[ -e "${repo_git}" || -L "${repo_git}" \
            || -e "${askpass}" || -L "${askpass}" ]]; then
            echo "The publisher fetch paths are not empty."
            exit 1
          fi
          umask 077
          git init --bare "${repo_git}" >/dev/null
          git --git-dir="${repo_git}" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\n" "${GH_TOKEN}" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "${askpass}"
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          trap 'unlink "${askpass}" 2>/dev/null || true' EXIT
          git --git-dir="${repo_git}" \
            -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c http.followRedirects=false \
            -c protocol.file.allow=never \
            -c submodule.recurse=false \
            fetch --no-tags --no-recurse-submodules origin \
              refs/heads/master:refs/remotes/origin/master \
              refs/heads/codex/v2-cutover-foundation:refs/remotes/origin/codex/v2-cutover-foundation
          unlink "${askpass}"
          trap - EXIT
          if [[ -e "${askpass}" || -L "${askpass}" \
            || "$(git --git-dir="${repo_git}" rev-parse refs/remotes/origin/codex/v2-cutover-foundation)" != "${remote_head}" ]]; then
            echo "The exact publisher source commit was not fetched."
            exit 1
          fi
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            read -r -a recovery_commit_and_parents <<<"$(
              git --git-dir="${repo_git}" rev-list --parents -n 1 "${remote_head}"
