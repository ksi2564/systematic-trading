name: v2 Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    environment: production-approval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e 'v2/backend[dev]'
      - run: pytest v2/backend/tests
      - working-directory: v2/frontend
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: wallant-v2-release-candidate
          path: |
            v2/backend
            v2/frontend/dist
            v2/infra
          if-no-files-found: error
          retention-days: 7
