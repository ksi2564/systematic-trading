            exit 1
          fi
          for index in "${!expected_tools[@]}"; do
            if [[ "${observed_tools[index]}" != "${expected_tools[index]}" \
              || ! -f "${locked_root}/${expected_tools[index]}" \
              || -L "${locked_root}/${expected_tools[index]}" ]]; then
              echo "The publisher tool tree does not match its allowlist."
              exit 1
            fi
