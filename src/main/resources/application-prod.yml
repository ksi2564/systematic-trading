spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS:1500000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT_MS:600000}
      keepalive-time: ${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME_MS:300000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:1}
    baseline-description: current_schema_before_flyway

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

logging:
  file:
    path: /var/log/trading
  level:
    org.hibernate.SQL: WARN
    my.side.trading: INFO

trading:
  scheduling:
    enabled: true
  execution:
    enabled: false
  security:
    public-path-prefixes:
      - /public/api/v1
    public-path-protection-mode: REVERSE_PROXY
    public-path-protection-note: 공개 포트폴리오 API는 리버스 프록시 또는 CDN 뒤에서만 노출한다.
    public-read-allowed-origins: ${TRADING_PUBLIC_READ_ALLOWED_ORIGINS:}
    public-rate-limit-per-minute: 120
    public-cache-max-age-seconds: 300
    public-client-ip-header: ${TRADING_PUBLIC_CLIENT_IP_HEADER:X-Forwarded-For}
    public-trusted-proxy-ranges: ${TRADING_PUBLIC_TRUSTED_PROXY_RANGES:}
    public-access-log-enabled: true
  operation:
    mode: PAPER
    alerts:
      enabled: true
      discord:
        enabled: true
        webhook-url: ${TRADING_DISCORD_WEBHOOK_URL:}
        connect-timeout: ${TRADING_DISCORD_CONNECT_TIMEOUT:3s}
        request-timeout: ${TRADING_DISCORD_REQUEST_TIMEOUT:5s}
