          C0B_ARCHIVE_B64_1: ${{ needs['collect-c0b-read-only'].outputs.archive_b64_1 }}
          C0B_ARCHIVE_B64_2: ${{ needs['collect-c0b-read-only'].outputs.archive_b64_2 }}
          C0B_ARCHIVE_B64_3: ${{ needs['collect-c0b-read-only'].outputs.archive_b64_3 }}
          C0B_ARCHIVE_SHA256: ${{ needs['collect-c0b-read-only'].outputs.archive_sha256 }}
          C0B_ARCHIVE_BYTES: ${{ needs['collect-c0b-read-only'].outputs.archive_bytes }}
          C0B_ARCHIVE_B64_CHARS: ${{ needs['collect-c0b-read-only'].outputs.archive_b64_chars }}
        run: |
          set -euo pipefail

          repo_git="${RUNNER_TEMP}/c0b-publisher.git"
          locked_root="${RUNNER_TEMP}/c0b-publisher-tool"
          locked_tools="${locked_root}/.github/scripts/c0b"
          archive_path="${RUNNER_TEMP}/c0b-received.tar.gz"
          evidence_dir="${RUNNER_TEMP}/c0b-received"
          if [[ ! -d "${repo_git}" || -L "${repo_git}" \
            || "$(git -C "${locked_root}" rev-parse HEAD)" != "${C0B_TOOL_COMMIT}" \
            || -n "$(git -C "${locked_root}" status --porcelain=v1 --untracked-files=all)" \
            || -e "${archive_path}" || -L "${archive_path}" \
            || -e "${evidence_dir}" || -L "${evidence_dir}" \
            || -e "${RUNNER_TEMP}/c0b-git-askpass" ]]; then
            echo "The token-free receive boundary is invalid."
            exit 1
          fi
          python3 -B -E -S "${locked_tools}/transport_bundle.py" receive \
            --archive "${archive_path}" \
            --output-dir "${evidence_dir}" \
            >/dev/null
          python3 -B -E -S "${locked_tools}/validate_evidence.py" bundle \
            --evidence-dir "${evidence_dir}" \
            --workflow-sha "${GITHUB_SHA}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${C0B_SOURCE_RUN_ATTEMPT}" \
            --repository-root "${locked_root}" \
            --decision-file "${locked_root}/docs/v2-cutover/C0_DECISIONS.md" \
            --known-deployments "${locked_tools}/known_deployments.json" \
            >/dev/null
          if [[ "$(find "${evidence_dir}" -type f | wc -l | tr -d ' ')" != 26 \
            || "$(find "${evidence_dir}" -mindepth 1 -type d | wc -l | tr -d ' ')" != 2 \
            || -n "$(find "${evidence_dir}" -type l -print -quit)" \
            || -n "$(find "${evidence_dir}" -type f ! -name '*.json' -print -quit)" ]]; then
            echo "The restored final bundle violates the exact 26-file boundary."
            exit 1
          fi

      - name: Build and verify the exact additions-only mutation request
        shell: bash
        env:
          C0B_INITIAL_REMOTE_HEAD: ${{ steps.publisher_fetch.outputs.remote_head }}
          C0B_PUBLISHER_MODE: ${{ steps.publisher_fetch.outputs.publisher_mode }}
        run: |
          set -euo pipefail

          repo_git="${RUNNER_TEMP}/c0b-publisher.git"
          locked_root="${RUNNER_TEMP}/c0b-publisher-tool"
          evidence_dir="${RUNNER_TEMP}/c0b-received"
          request_path="${RUNNER_TEMP}/c0b-create-commit.json"
          metadata_path="${RUNNER_TEMP}/c0b-publish-metadata.json"
          if [[ -n "$(git --git-dir="${repo_git}" ls-tree -r --name-only \
              "${GITHUB_SHA}" -- docs/v2-cutover/evidence/c0b)" \
            || -e "${request_path}" || -L "${request_path}" \
            || -e "${metadata_path}" || -L "${metadata_path}" \
            || -e "${RUNNER_TEMP}/c0b-git-askpass" ]]; then
            echo "The additions-only mutation precondition is invalid."
            exit 1
          fi
          LOCKED_TOOLS="${locked_root}/.github/scripts/c0b" \
          EVIDENCE_DIR="${evidence_dir}" \
          REQUEST_PATH="${request_path}" \
          METADATA_PATH="${metadata_path}" \
          python3 -B -E -S - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import stat
          import sys
          from pathlib import Path

          tools = Path(os.environ["LOCKED_TOOLS"])
          sys.path.insert(0, str(tools))
          from transport_bundle import EXPECTED_RELATIVE_PATHS, _bundle_payloads

          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          request_path = Path(os.environ["REQUEST_PATH"])
          metadata_path = Path(os.environ["METADATA_PATH"])
          source_attempt = os.environ["C0B_SOURCE_RUN_ATTEMPT"]
          transport_nonce = os.environ["C0B_TRANSPORT_NONCE"]
          initial_remote_head = os.environ["C0B_INITIAL_REMOTE_HEAD"]
          publisher_mode = os.environ["C0B_PUBLISHER_MODE"]
          if (
              re.fullmatch(r"[1-9][0-9]{0,3}", source_attempt) is None
              or re.fullmatch(r"[0-9a-f]{64}", transport_nonce) is None
              or re.fullmatch(r"[0-9a-f]{40}", initial_remote_head) is None
              or publisher_mode not in {"create", "recover_existing"}
              or (publisher_mode == "create")
              != (initial_remote_head == os.environ["GITHUB_SHA"])
          ):
              raise SystemExit("Mutation provenance is invalid.")
          payloads = _bundle_payloads(evidence_dir)
          prefix = "docs/v2-cutover/evidence/c0b"
          repo_paths = tuple(f"{prefix}/{path}" for path in EXPECTED_RELATIVE_PATHS)
          manifest = b"".join(
              path.encode("ascii")
              + b"\0"
              + str(len(payloads[relative])).encode("ascii")
              + b"\0"
              + hashlib.sha256(payloads[relative]).hexdigest().encode("ascii")
              + b"\n"
              for path, relative in zip(repo_paths, EXPECTED_RELATIVE_PATHS)
          )
          manifest_sha = hashlib.sha256(manifest).hexdigest()
          client_id = (
              f"c0b-{os.environ['GITHUB_RUN_ID']}-{source_attempt}-"
              f"{transport_nonce}"
          )
          headline = "docs(v2): preserve sanitized C0-B evidence"
          body = "\n".join(
              (
                  f"workflow-sha: {os.environ['GITHUB_SHA']}",
                  f"workflow-run-id: {os.environ['GITHUB_RUN_ID']}",
                  f"workflow-run-attempt: {source_attempt}",
                  f"transport-nonce: {transport_nonce}",
                  f"manifest-sha256: {manifest_sha}",
              )
          )
          query = """mutation CreateC0BEvidence($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              clientMutationId
              commit {
                oid
                url
                messageHeadline
                committedDate
                tree { oid }
                parents(first: 2) { totalCount nodes { oid } }
                signature { isValid state verifiedAt wasSignedByGitHub }
              }
              ref { name prefix target { oid } }
            }
          }"""
          additions = [
              {
                  "path": repo_path,
                  "contents": base64.b64encode(payloads[relative]).decode("ascii"),
              }
              for repo_path, relative in zip(repo_paths, EXPECTED_RELATIVE_PATHS)
          ]
          request = {
              "query": query,
              "variables": {
                  "input": {
                      "branch": {
                          "repositoryNameWithOwner": os.environ["GITHUB_REPOSITORY"],
                          "branchName": "codex/v2-cutover-foundation",
                      },
                      "message": {"headline": headline, "body": body},
                      "expectedHeadOid": os.environ["GITHUB_SHA"],
                      "fileChanges": {"additions": additions},
                      "clientMutationId": client_id,
                  }
              },
          }
          request_bytes = json.dumps(
              request, ensure_ascii=True, separators=(",", ":")
          ).encode("ascii") + b"\n"
          if len(request_bytes) > 2_000_000:
              raise SystemExit("Mutation request exceeds its bounded size.")
          parsed_input = request["variables"]["input"]
          if (
              set(parsed_input["fileChanges"]) != {"additions"}
              or len(additions) != 26
              or tuple(item["path"] for item in additions) != repo_paths
              or len(set(repo_paths)) != 26
              or any(path.startswith("/") or ".." in Path(path).parts for path in repo_paths)
          ):
              raise SystemExit("Mutation request violates the additions-only boundary.")
          for addition, relative in zip(additions, EXPECTED_RELATIVE_PATHS):
              if base64.b64decode(addition["contents"], validate=True) != payloads[relative]:
                  raise SystemExit("Mutation request changed evidence bytes.")
          metadata = {
              "schema_version": 1,
              "client_mutation_id": client_id,
              "expected_headline": headline,
              "expected_message": headline + "\n\n" + body,
              "expected_repo_paths": list(repo_paths),
              "relative_paths": list(EXPECTED_RELATIVE_PATHS),
              "manifest_sha256": manifest_sha,
              "source_run_attempt": int(source_attempt),
              "transport_nonce": transport_nonce,
              "initial_remote_head": initial_remote_head,
              "publisher_mode": publisher_mode,
              "request_sha256": hashlib.sha256(request_bytes).hexdigest(),
          }
          metadata_bytes = json.dumps(
              metadata, ensure_ascii=True, sort_keys=True, separators=(",", ":")
          ).encode("ascii") + b"\n"

          def write_exclusive(path: Path, payload: bytes) -> None:
              if path.exists() or path.is_symlink():
                  raise SystemExit("Mutation output path already exists.")
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
              if hasattr(os, "O_NOFOLLOW"):
                  flags |= os.O_NOFOLLOW
              descriptor = os.open(path, flags, 0o600)
              try:
                  view = memoryview(payload)
                  while view:
                      written = os.write(descriptor, view)
                      if written < 1:
                          raise SystemExit("Mutation output write made no progress.")
                      view = view[written:]
                  os.fchmod(descriptor, 0o600)
                  os.fsync(descriptor)
                  if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                      raise SystemExit("Mutation output is not a regular file.")
              finally:
                  os.close(descriptor)

          write_exclusive(request_path, request_bytes)
          write_exclusive(metadata_path, metadata_bytes)
          PY
          if [[ ! -f "${request_path}" || -L "${request_path}" \
            || ! -f "${metadata_path}" || -L "${metadata_path}" \
            || "$(wc -c < "${request_path}" | tr -d ' ')" -gt 2000000 ]]; then
            echo "The mutation request files are invalid."
            exit 1
          fi

      - name: Atomically preserve and verify the evidence-only commit
        id: c0b_commit
        shell: bash
        env:
          C0B_INITIAL_REMOTE_HEAD: ${{ steps.publisher_fetch.outputs.remote_head }}
          C0B_PUBLISHER_MODE: ${{ steps.publisher_fetch.outputs.publisher_mode }}
          GH_HOST: github.com
          GH_PROMPT_DISABLED: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_version="2026-03-10"
          branch_name="codex/v2-cutover-foundation"
          request_path="${RUNNER_TEMP}/c0b-create-commit.json"
          metadata_path="${RUNNER_TEMP}/c0b-publish-metadata.json"
          evidence_dir="${RUNNER_TEMP}/c0b-received"
          client_id="$(jq -er '.client_mutation_id' "${metadata_path}")"
          expected_headline="$(jq -er '.expected_headline' "${metadata_path}")"
          expected_message="$(jq -er '.expected_message' "${metadata_path}")"
          expected_request_sha="$(jq -er '.request_sha256' "${metadata_path}")"
          manifest_sha="$(jq -er '.manifest_sha256' "${metadata_path}")"
          metadata_source_attempt="$(jq -er '.source_run_attempt' "${metadata_path}")"
          metadata_nonce="$(jq -er '.transport_nonce' "${metadata_path}")"
          metadata_initial_head="$(jq -er '.initial_remote_head' "${metadata_path}")"
          metadata_mode="$(jq -er '.publisher_mode' "${metadata_path}")"
          expected_client_id="c0b-${GITHUB_RUN_ID}-${C0B_SOURCE_RUN_ATTEMPT}-${C0B_TRANSPORT_NONCE}"
          if [[ ! "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,3}$ \
            || ! "${C0B_SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,3}$ \
            || ! "${C0B_TRANSPORT_NONCE}" =~ ^[0-9a-f]{64}$ \
            || "${C0B_SOURCE_RUN_ATTEMPT}" -gt "${GITHUB_RUN_ATTEMPT}" \
            || "${client_id}" != "${expected_client_id}" \
            || ! "${client_id}" =~ ^c0b-[1-9][0-9]{0,19}-[1-9][0-9]{0,3}-[0-9a-f]{64}$ \
            || ! "${expected_request_sha}" =~ ^[0-9a-f]{64}$ \
            || ! "${manifest_sha}" =~ ^[0-9a-f]{64}$ \
            || "${metadata_source_attempt}" != "${C0B_SOURCE_RUN_ATTEMPT}" \
            || "${metadata_nonce}" != "${C0B_TRANSPORT_NONCE}" \
            || "${metadata_initial_head}" != "${C0B_INITIAL_REMOTE_HEAD}" \
            || "${metadata_mode}" != "${C0B_PUBLISHER_MODE}" \
            || ! "${C0B_INITIAL_REMOTE_HEAD}" =~ ^[0-9a-f]{40}$ \
            || ! "${C0B_PUBLISHER_MODE}" =~ ^(create|recover_existing)$ \
            || ( "${C0B_PUBLISHER_MODE}" == create \
              && "${C0B_INITIAL_REMOTE_HEAD}" != "${GITHUB_SHA}" ) \
            || ( "${C0B_PUBLISHER_MODE}" == recover_existing \
              && ( "${C0B_INITIAL_REMOTE_HEAD}" == "${GITHUB_SHA}" \
                || "${GITHUB_RUN_ATTEMPT}" -le "${C0B_SOURCE_RUN_ATTEMPT}" ) ) \
            || "$(sha256sum "${request_path}" | awk '{print $1}')" != "${expected_request_sha}" \
            || -e "${RUNNER_TEMP}/c0b-git-askpass" ]]; then
            echo "The prevalidated mutation request changed before use."
            exit 1
          fi
          if ! jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg parent "${GITHUB_SHA}" \
              --arg client_id "${client_id}" \
              '
                .variables.input.branch.repositoryNameWithOwner == $repository and
                .variables.input.branch.branchName == "codex/v2-cutover-foundation" and
                .variables.input.expectedHeadOid == $parent and
                .variables.input.clientMutationId == $client_id and
                (.variables.input.fileChanges | keys) == ["additions"] and
                (.variables.input.fileChanges.additions | length) == 26
              ' "${request_path}" >/dev/null; then
            echo "The mutation request no longer has its exact CAS boundary."
            exit 1
          fi

          fetch_api() {
            local endpoint="$1"
            local destination="$2"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh api -H "X-GitHub-Api-Version: ${api_version}" \
                  "${endpoint}" > "${destination}.next" 2>/dev/null; then
                mv -f -- "${destination}.next" "${destination}"
                return 0
              fi
              rm -f -- "${destination}.next"
              if [[ "${attempt}" -lt 5 ]]; then
                sleep 2
              fi
            done
            return 1
          }

          branch_json="${RUNNER_TEMP}/c0b-branch-before.json"
          run_json="${RUNNER_TEMP}/c0b-run-before.json"
          fetch_api \
            "repos/${GITHUB_REPOSITORY}/git/refs?per_page=100" \
            "${branch_json}"
          fetch_api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${run_json}"
          same_sha_runs="$(
            gh api -H "X-GitHub-Api-Version: ${api_version}" --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-prod.yml/runs" \
              -f event=workflow_dispatch \
              -f head_sha="${GITHUB_SHA}" \
              -f per_page=100
          )"
          if ! jq -e --arg initial_head "${C0B_INITIAL_REMOTE_HEAD}" '
                type == "array" and
                length < 100 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
                  | length) == 1 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")][0]
                  | .object.type == "commit" and .object.sha == $initial_head)
              ' "${branch_json}" >/dev/null \
            || ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .id == $run_id and
                .run_attempt == $run_attempt and
                .event == "workflow_dispatch" and
                .head_sha == $head_sha and
                .path == ".github/workflows/deploy-prod.yml" and
                .actor.login == "ksi2564" and
                .triggering_actor.login == "ksi2564" and
                .status == "in_progress" and
                .conclusion == null
              ' "${run_json}" >/dev/null \
            || ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .total_count == 1 and
                (.workflow_runs | length) == 1 and
                .workflow_runs[0].id == $run_id and
                .workflow_runs[0].run_attempt == $run_attempt and
                .workflow_runs[0].head_sha == $head_sha
              ' <<<"${same_sha_runs}" >/dev/null; then
            echo "The atomic commit precondition is invalid."
            exit 1
          fi

          mutation_correlated() {
            local response="$1"
            jq -e \
              --arg client_id "${client_id}" \
              --arg parent "${GITHUB_SHA}" \
              --arg branch "${branch_name}" \
              --arg headline "${expected_headline}" \
              '
                (has("errors") | not) and
                .data.createCommitOnBranch.clientMutationId == $client_id and
                (.data.createCommitOnBranch.commit.oid | test("^[0-9a-f]{40}$")) and
                .data.createCommitOnBranch.commit.messageHeadline == $headline and
                (.data.createCommitOnBranch.commit.tree.oid | test("^[0-9a-f]{40}$")) and
                .data.createCommitOnBranch.commit.parents.totalCount == 1 and
                (.data.createCommitOnBranch.commit.parents.nodes | length) == 1 and
                .data.createCommitOnBranch.commit.parents.nodes[0].oid == $parent and
                .data.createCommitOnBranch.commit.signature.isValid == true and
                .data.createCommitOnBranch.commit.signature.state == "VALID" and
                .data.createCommitOnBranch.commit.signature.wasSignedByGitHub == true and
                (.data.createCommitOnBranch.commit.signature.verifiedAt | type) == "string" and
                .data.createCommitOnBranch.ref.prefix == "refs/heads/" and
                .data.createCommitOnBranch.ref.name == $branch and
                .data.createCommitOnBranch.ref.target.oid == .data.createCommitOnBranch.commit.oid
              ' "${response}" >/dev/null
          }

          response_path="${RUNNER_TEMP}/c0b-create-commit-response.json"
          evidence_commit=''
          preservation_state=''
          if [[ "${C0B_PUBLISHER_MODE}" == recover_existing ]]; then
            evidence_commit="${C0B_INITIAL_REMOTE_HEAD}"
            preservation_state=recovered_existing
          else
            set +e
            gh api graphql --input "${request_path}" \
              > "${response_path}" 2>/dev/null
            mutation_exit=$?
            set -e
            response_candidate=''
            if [[ "${mutation_exit}" -eq 0 \
              && -f "${response_path}" && ! -L "${response_path}" ]] \
              && mutation_correlated "${response_path}"; then
              response_candidate="$(
                jq -er '.data.createCommitOnBranch.commit.oid' "${response_path}"
              )"
            fi

            observed_non_source=''
            for observation_attempt in 1 2 3 4 5; do
              observation_ref="${RUNNER_TEMP}/c0b-branch-observed.json"
              fetch_api \
                "repos/${GITHUB_REPOSITORY}/git/refs?per_page=100" \
                "${observation_ref}"
              if ! jq -e '
                    type == "array" and
                    length < 100 and
                    ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
                      | length) == 1 and
                    ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")][0]
                      | .object.type == "commit" and
                        (.object.sha | test("^[0-9a-f]{40}$")))
                  ' "${observation_ref}" >/dev/null; then
                echo "The post-mutation branch observation is invalid."
                exit 1
              fi
              observed_head="$(
                jq -er '
                  [.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
                  | if length == 1 then .[0].object.sha else empty end
                ' "${observation_ref}"
              )"
              if [[ "${observed_head}" != "${GITHUB_SHA}" ]]; then
                if [[ -n "${observed_non_source}" \
                  && "${observed_non_source}" != "${observed_head}" ]]; then
                  echo "The branch moved through multiple post-mutation heads."
                  exit 1
                fi
                observed_non_source="${observed_head}"
                if [[ -n "${response_candidate}" \
                  && "${response_candidate}" != "${observed_head}" ]]; then
                  echo "The mutation response and branch head disagree."
                  exit 1
                fi
                evidence_commit="${observed_head}"
                break
              fi
              if [[ "${observation_attempt}" -lt 5 ]]; then
                sleep 2
              fi
            done
            if [[ -z "${evidence_commit}" ]]; then
              echo "No evidence commit was observed; this attempt will not retry the mutation."
              exit 1
            fi
            if [[ -n "${response_candidate}" ]]; then
              preservation_state=created
            else
              preservation_state=recovered_after_ambiguous_response
            fi
          fi
          if [[ ! "${evidence_commit}" =~ ^[0-9a-f]{40}$ \
            || "${evidence_commit}" == "${GITHUB_SHA}" \
            || ! "${preservation_state}" =~ ^(created|recovered_after_ambiguous_response|recovered_existing)$ ]]; then
            echo "The evidence commit candidate is invalid."
            exit 1
          fi

          candidate_branch="${RUNNER_TEMP}/c0b-branch-candidate.json"
          fetch_api \
            "repos/${GITHUB_REPOSITORY}/git/refs?per_page=100" \
            "${candidate_branch}"
          if ! jq -e --arg commit "${evidence_commit}" '
                type == "array" and
                length < 100 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
                  | length) == 1 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")][0]
                  | .object.type == "commit" and .object.sha == $commit)
              ' "${candidate_branch}" >/dev/null; then
            echo "The evidence candidate is not the stable branch head."
            exit 1
          fi

          repo_git="${RUNNER_TEMP}/c0b-publisher.git"
          askpass="${RUNNER_TEMP}/c0b-git-askpass"
          if [[ ! -d "${repo_git}" || -L "${repo_git}" \
            || -e "${askpass}" || -L "${askpass}" ]]; then
            echo "The post-mutation Git fetch boundary is invalid."
            exit 1
          fi
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  *Username*) printf "%s\n" "x-access-token" ;;' \
            '  *Password*) printf "%s\n" "${GH_TOKEN}" ;;' \
            '  *) exit 1 ;;' \
            'esac' > "${askpass}"
          chmod 700 "${askpass}"
          export GIT_ASKPASS="${askpass}"
          trap 'unlink "${askpass}" 2>/dev/null || true' EXIT
          git --git-dir="${repo_git}" \
            -c core.hooksPath=/dev/null \
            -c credential.helper= \
            -c http.followRedirects=false \
            -c protocol.file.allow=never \
            -c submodule.recurse=false \
            fetch --no-tags --no-recurse-submodules origin \
              "refs/heads/${branch_name}:refs/remotes/origin/${branch_name}"
          unlink "${askpass}"
          unset GIT_ASKPASS
          trap - EXIT
          if [[ -e "${askpass}" || -L "${askpass}" \
            || "$(git --git-dir="${repo_git}" rev-parse \
              "refs/remotes/origin/${branch_name}")" != "${evidence_commit}" ]]; then
            echo "The fetched evidence commit does not match the observed branch head."
            exit 1
          fi

          signature_json="${RUNNER_TEMP}/c0b-evidence-signature.json"
          signature_query='query VerifyC0BSignature($owner: String!, $name: String!, $oid: GitObjectID!) {
            repository(owner: $owner, name: $name) {
              nameWithOwner
              object(oid: $oid) {
                ... on Commit {
                  oid
                  message
                  messageHeadline
                  tree { oid }
                  parents(first: 2) { totalCount nodes { oid } }
                  signature {
                    isValid
                    state
                    verifiedAt
                    wasSignedByGitHub
                    signer { login }
                  }
                }
              }
            }
          }'
          signature_verified=false
          for signature_attempt in 1 2 3 4 5; do
            if gh api graphql \
                -f query="${signature_query}" \
                -f owner=ksi2564 \
                -f name=systematic-trading \
                -f oid="${evidence_commit}" \
                > "${signature_json}.next" 2>/dev/null \
              && jq -e \
                --arg commit "${evidence_commit}" \
                --arg parent "${GITHUB_SHA}" \
                --arg headline "${expected_headline}" \
                --arg message "${expected_message}" \
                '
                (has("errors") | not) and
                .data.repository.nameWithOwner == "ksi2564/systematic-trading" and
                .data.repository.object.oid == $commit and
                .data.repository.object.message == $message and
                .data.repository.object.messageHeadline == $headline and
                (.data.repository.object.tree.oid | test("^[0-9a-f]{40}$")) and
                .data.repository.object.parents.totalCount == 1 and
                (.data.repository.object.parents.nodes | length) == 1 and
                .data.repository.object.parents.nodes[0].oid == $parent and
                .data.repository.object.signature.isValid == true and
                .data.repository.object.signature.state == "VALID" and
                .data.repository.object.signature.wasSignedByGitHub == true and
                (.data.repository.object.signature.verifiedAt | type) == "string"
              ' "${signature_json}.next" >/dev/null; then
              mv -f -- "${signature_json}.next" "${signature_json}"
              signature_verified=true
              break
            fi
            rm -f -- "${signature_json}.next"
            if [[ "${signature_attempt}" -lt 5 ]]; then
              sleep 2
            fi
          done
          if [[ "${signature_verified}" != true ]]; then
            echo "The evidence commit is not verified as GitHub-signed."
            exit 1
          fi
          METADATA_PATH="${metadata_path}" \
          REPO_GIT="${repo_git}" \
          EVIDENCE_DIR="${evidence_dir}" \
          EVIDENCE_COMMIT="${evidence_commit}" \
          python3 -B -E -S - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          metadata = json.loads(Path(os.environ["METADATA_PATH"]).read_text("ascii"))
          repo_git = Path(os.environ["REPO_GIT"])
          evidence_dir = Path(os.environ["EVIDENCE_DIR"])
          expected = tuple(metadata["expected_repo_paths"])
          relative = tuple(metadata["relative_paths"])
          prefix = "docs/v2-cutover/evidence/c0b"
          candidate = os.environ["EVIDENCE_COMMIT"]
          parent = os.environ["GITHUB_SHA"]

          def git(*arguments: str) -> bytes:
              process = subprocess.run(
                  ["git", f"--git-dir={repo_git}", *arguments],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if process.returncode != 0:
                  raise SystemExit("Fetched evidence Git verification failed.")
              return process.stdout

          remote_ref = git(
              "rev-parse", "refs/remotes/origin/codex/v2-cutover-foundation"
          ).decode("ascii").strip()
          commit_type = git("cat-file", "-t", candidate).decode("ascii").strip()
          parent_line = git("rev-list", "--parents", "-n", "1", candidate).decode(
              "ascii"
          ).split()
          raw_commit = git("cat-file", "commit", candidate)
          if b"\n\n" not in raw_commit:
              raise SystemExit("Fetched evidence commit object is malformed.")
          commit_message = raw_commit.split(b"\n\n", 1)[1].decode("utf-8").rstrip("\n")

          diff_lines = git(
              "diff-tree", "--no-commit-id", "--name-status", "-r", parent, candidate
          ).decode("utf-8").splitlines()
          changes = [line.split("\t", 1) for line in diff_lines]
          changed_paths = tuple(parts[1] for parts in changes if len(parts) == 2)

          tree_lines = git("ls-tree", "-r", candidate, "--", prefix).decode(
              "utf-8"
          ).splitlines()
          tree_entries = []
          for line in tree_lines:
              metadata_text, separator, path = line.partition("\t")
              fields = metadata_text.split()
              if not separator or len(fields) != 3:
                  raise SystemExit("Fetched evidence tree entry is malformed.")
              tree_entries.append((fields[0], fields[1], fields[2], path))
          tree_paths = tuple(entry[3] for entry in tree_entries)

          if (
              re.fullmatch(r"[0-9a-f]{40}", candidate) is None
              or remote_ref != candidate
              or commit_type != "commit"
              or parent_line != [candidate, parent]
              or commit_message != metadata["expected_message"]
              or len(expected) != 26
              or len(relative) != 26
              or len(set(expected)) != 26
              or len(set(relative)) != 26
              or tuple(sorted(expected)) != expected
              or any(
                  repo_path != f"{prefix}/{relative_path}"
                  for repo_path, relative_path in zip(expected, relative)
              )
              or len(changes) != 26
              or any(len(parts) != 2 or parts[0] != "A" for parts in changes)
              or tuple(sorted(changed_paths)) != expected
              or len(tree_entries) != 26
              or tuple(sorted(tree_paths)) != expected
              or any(
                  mode != "100644"
                  or object_type != "blob"
                  or re.fullmatch(r"[0-9a-f]{40}", object_id) is None
                  for mode, object_type, object_id, _path in tree_entries
              )
          ):
              raise SystemExit("Fetched commit violates the exact evidence boundary.")

          for repo_path, relative_path in zip(expected, relative):
              local = (evidence_dir / relative_path).read_bytes()
              remote = git("show", f"{candidate}:{repo_path}")
              if remote != local:
                  raise SystemExit("Fetched evidence bytes differ from the validated bundle.")
          PY

          final_branch="${RUNNER_TEMP}/c0b-branch-after.json"
          final_run="${RUNNER_TEMP}/c0b-run-after.json"
          fetch_api \
            "repos/${GITHUB_REPOSITORY}/git/refs?per_page=100" \
            "${final_branch}"
          fetch_api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${final_run}"
          if ! jq -e --arg commit "${evidence_commit}" '
                type == "array" and
                length < 100 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")]
                  | length) == 1 and
                ([.[] | select(.ref == "refs/heads/codex/v2-cutover-foundation")][0]
                  | .object.type == "commit" and .object.sha == $commit)
              ' "${final_branch}" >/dev/null \
            || ! jq -e \
              --argjson run_id "${GITHUB_RUN_ID}" \
              --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
              --arg head_sha "${GITHUB_SHA}" \
              '
                .id == $run_id and
                .run_attempt == $run_attempt and
                .head_sha == $head_sha and
                .path == ".github/workflows/deploy-prod.yml" and
                .status == "in_progress" and
                .conclusion == null
              ' "${final_run}" >/dev/null; then
            echo "The final Git preservation binding changed."
            exit 1
          fi
          echo "evidence_commit=${evidence_commit}" >> "${GITHUB_OUTPUT}"
          echo "preservation_state=${preservation_state}" >> "${GITHUB_OUTPUT}"
          echo "source_run_attempt=${C0B_SOURCE_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "publisher_run_attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "manifest_sha256=${manifest_sha}" >> "${GITHUB_OUTPUT}"
          echo "Preserved the sanitized C0-B evidence commit: ${evidence_commit}"

      - name: Remove residual sanitized publisher material
        if: always()
        shell: bash
        env:
          C0B_EVIDENCE_COMMIT: ${{ steps.c0b_commit.outputs.evidence_commit }}
          C0B_PRESERVATION_STATE: ${{ steps.c0b_commit.outputs.preservation_state }}
        run: |
          set -euo pipefail

          if [[ -n "${C0B_EVIDENCE_COMMIT}" || -n "${C0B_PRESERVATION_STATE}" ]]; then
            if [[ ! "${C0B_EVIDENCE_COMMIT}" =~ ^[0-9a-f]{40}$ \
              || ! "${C0B_PRESERVATION_STATE}" =~ ^(created|recovered_after_ambiguous_response|recovered_existing)$ ]]; then
              echo "The publisher result outputs are incomplete."
              exit 1
            fi
            echo "C0-B preservation state: ${C0B_PRESERVATION_STATE}"
            echo "C0-B evidence commit: ${C0B_EVIDENCE_COMMIT}"
          fi

          if [[ ! -d "${RUNNER_TEMP}" || -L "${RUNNER_TEMP}" ]]; then
            echo "The runner temporary directory is invalid."
            exit 1
          fi
          mapfile -d '' publisher_targets < <(
            find "${RUNNER_TEMP}" -mindepth 1 -maxdepth 1 \
              -name 'c0b-*' -print0
          )
          for target in "${publisher_targets[@]}"; do
            if [[ "${target}" != "${RUNNER_TEMP}"/c0b-* ]]; then
              echo "A publisher cleanup target escaped its prefix boundary."
              exit 1
            fi
            if [[ -d "${target}" && ! -L "${target}" ]]; then
              rm -rf -- "${target}"
            elif [[ -e "${target}" || -L "${target}" ]]; then
              rm -f -- "${target}"
            fi
          done
          if [[ -n "$(find "${RUNNER_TEMP}" -mindepth 1 -maxdepth 1 \
              -name 'c0b-*' -print -quit)" ]]; then
            echo "Residual publisher material was not removed."
            exit 1
          fi
