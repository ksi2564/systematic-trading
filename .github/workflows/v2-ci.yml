name: v2 CI

on:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts and Compose config
        env:
          WALLANT_MYSQL_PASSWORD: ci-placeholder
          WALLANT_MYSQL_ROOT_PASSWORD: ci-root-placeholder
        run: |
          bash -n \
            v2/infra/scripts/bootstrap_staging.sh \
            v2/infra/scripts/preflight_staging.sh \
            v2/infra/scripts/deploy_staging.sh
          docker compose -f v2/infra/compose.yaml config --quiet
          grep -F \
            'ExecStart=/opt/wallant/current/venv/bin/python -m uvicorn' \
            v2/infra/systemd/wallant-v2-api.service
          venv_test_root="$(mktemp -d)"
          python3 -m venv "${venv_test_root}/release.incoming/venv"
          mv "${venv_test_root}/release.incoming" "${venv_test_root}/release"
          "${venv_test_root}/release/venv/bin/python" -c 'import sys; print(sys.prefix)'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: >-
          pytest
          -W error
          -W "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning"
          --cov=wallant
          --cov-fail-under=80
      - run: |
          migration_db="$(mktemp /tmp/wallant-migration-XXXXXX.db)"
          WALLANT_ENVIRONMENT=test \
          WALLANT_DATABASE_URL="sqlite+pysqlite:///$migration_db" \
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
