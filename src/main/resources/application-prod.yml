spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

logging:
  file:
    path: /var/log/trading
  level:
    org.hibernate.SQL: WARN
    my.side.trading: INFO

trading:
  scheduling:
    enabled: true
  execution:
    enabled: false
  security:
    public-path-prefixes:
      - /public/api/v1
    public-path-protection-mode: REVERSE_PROXY
    public-path-protection-note: 공개 포트폴리오 API는 리버스 프록시 또는 CDN 뒤에서만 노출한다.
    public-read-allowed-origins: ${TRADING_PUBLIC_READ_ALLOWED_ORIGINS:}
    public-rate-limit-per-minute: 120
    public-cache-max-age-seconds: 300
    public-client-ip-header: X-Forwarded-For
    public-trusted-proxy-ranges: ${TRADING_PUBLIC_TRUSTED_PROXY_RANGES:}
    public-access-log-enabled: true
  operation:
    mode: PAPER
    alerts:
      enabled: true
      discord:
        enabled: true
        webhook-url: ${TRADING_DISCORD_WEBHOOK_URL:}
