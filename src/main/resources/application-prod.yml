spring:
  config:
    activate:
      on-profile: prod

logging:
  file:
    path: /var/logs
  level:
    # 운영 환경에서는 SQL 로그를 줄이거나 INFO로 변경
    org.hibernate.SQL: INFO
    my.side.trading: INFO

trading:
  security:
    # prod에서는 운영 API와 Actuator를 public-path-prefixes로 열면 기동 시 실패한다.
    public-path-prefixes: []
