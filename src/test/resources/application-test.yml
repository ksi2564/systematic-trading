spring:
  datasource:
    url: jdbc:h2:mem:trading-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

kis:
  app-key: test-app-key
  app-secret: test-app-secret
  account-no: 00000000-00
  cano: 00000000
  acnt-prdt-cd: 00

trading:
  security:
    api-key: test-api-key
