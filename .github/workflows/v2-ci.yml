name: v2 CI

on:
  push:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -W error --cov=wallant --cov-fail-under=80
      - run: |
          migration_db="$(mktemp /tmp/wallant-migration-XXXXXX.db)"
          WALLANT_ENVIRONMENT=test \
          WALLANT_DATABASE_URL="sqlite+pysqlite:///$migration_db" \
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
