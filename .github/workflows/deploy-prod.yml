            exit 1
          fi
          git --git-dir="${repo_git}" cat-file -e "${C0B_TOOL_COMMIT}^{commit}"
          git --git-dir="${repo_git}" cat-file -e "${C0B_TOOL_PARENT}^{commit}"
          read -r -a tool_commit_and_parents <<<"$(
            git --git-dir="${repo_git}" rev-list --parents -n 1 "${C0B_TOOL_COMMIT}"
          )"
          if [[ "${#tool_commit_and_parents[@]}" -ne 2 \
            || "${tool_commit_and_parents[0]}" != "${C0B_TOOL_COMMIT}" \
            || "${tool_commit_and_parents[1]}" != "${C0B_TOOL_PARENT}" ]]; then
            echo "The transport tool commit ancestry is invalid."
            exit 1
          fi
          mapfile -t tool_commit_paths < <(
            git --git-dir="${repo_git}" diff --name-only \
              "${C0B_TOOL_PARENT}" "${C0B_TOOL_COMMIT}"
          )
          expected_tool_commit_paths=(
            .github/scripts/c0b/collect_remote.sh
            .github/scripts/c0b/contract.py
            .github/scripts/c0b/test_c0b_tools.py
          )
          if [[ "${#tool_commit_paths[@]}" -ne "${#expected_tool_commit_paths[@]}" ]]; then
            echo "The transport tool commit path count is invalid."
            exit 1
          fi
          for index in "${!expected_tool_commit_paths[@]}"; do
            if [[ "${tool_commit_paths[index]}" != "${expected_tool_commit_paths[index]}" ]]; then
              echo "The transport tool commit changed an unexpected path."
              exit 1
            fi
          done

          read -r -a workflow_commit_and_parents <<<"$(
            git --git-dir="${repo_git}" rev-list --parents -n 1 "${GITHUB_SHA}"
          )"
          mapfile -t workflow_commit_paths < <(
            git --git-dir="${repo_git}" diff --name-only \
              "${C0B_TOOL_COMMIT}" "${GITHUB_SHA}"
          )
          if [[ "${#workflow_commit_and_parents[@]}" -ne 2 \
            || "${workflow_commit_and_parents[0]}" != "${GITHUB_SHA}" \
            || "${workflow_commit_and_parents[1]}" != "${C0B_TOOL_COMMIT}" \
            || "${#workflow_commit_paths[@]}" -ne 1 \
            || "${workflow_commit_paths[0]}" != ".github/workflows/deploy-prod.yml" \
            || -n "$(git --git-dir="${repo_git}" ls-tree -r --name-only \
              "${GITHUB_SHA}" -- docs/v2-cutover/evidence/c0b)" ]]; then
