spring:
  datasource:
    url: jdbc:mysql://localhost:3306/trading?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    org.hibernate.SQL: debug

# 한국투자증권 open api 연결
kis:
  base-url: https://openapi.koreainvestment.com:9443
  app-key: ${KIS_APP_KEY}
  app-secret: ${KIS_APP_SECRET}
  account-no: ${KIS_ACCOUNT_NO}
  cano: ${KIS_CANO}
  acnt-prdt-cd: ${KIS_ACNT_PRDT_CD}

trading:
  scheduling:
    enabled: false
  execution:
    enabled: false
  strategy:
    tolerance-pct: 5.0
    symbols:
      - QQQ
      - QLD
      - TQQQ
    sell-priority:
      - TQQQ
      - QLD
      - QQQ
    buy-priority:
      - QQQ
      - QLD
      - TQQQ
  circuit-breaker:
    enabled: true
    vix-enabled: true
    vix-threshold: 35
    ma-period: 200