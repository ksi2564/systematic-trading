          locked_root="${RUNNER_TEMP}/c0b-publisher-tool"
          if [[ ! -d "${repo_git}" || -L "${repo_git}" \
            || -e "${RUNNER_TEMP}/c0b-git-askpass" \
            || -e "${locked_root}" || -L "${locked_root}" ]]; then
