            if [[ "${#recovery_commit_and_parents[@]}" -ne 2 \
              || "${recovery_commit_and_parents[0]}" != "${remote_head}" \
              || "${recovery_commit_and_parents[1]}" != "${GITHUB_SHA}" ]]; then
              echo "The failed-job recovery head is not a direct child of the source commit."
              exit 1
            fi
          fi
          if [[ "${remote_head}" == "${GITHUB_SHA}" ]]; then
            publisher_mode=create
          else
            publisher_mode=recover_existing
          fi
          echo "remote_head=${remote_head}" >> "${GITHUB_OUTPUT}"
          echo "publisher_mode=${publisher_mode}" >> "${GITHUB_OUTPUT}"

      - name: Rebuild and verify the locked publisher tools
        shell: bash
