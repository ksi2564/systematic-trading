spring:
  config:
    import: optional:classpath:application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3306/trading?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

logging:
  file:
    path: logs
  level:
    org.hibernate.SQL: debug

# 한국투자증권 open api 연결
kis:
  base-url: https://openapi.koreainvestment.com:9443
  app-key: ${KIS_APP_KEY}
  app-secret: ${KIS_APP_SECRET}
  account-no: ${KIS_ACCOUNT_NO}
  cano: ${KIS_CANO}
  acnt-prdt-cd: ${KIS_ACNT_PRDT_CD}
  connect-timeout: ${KIS_CONNECT_TIMEOUT:3s}
  request-timeout: ${KIS_REQUEST_TIMEOUT:10s}

trading:
  market-calendar:
    market-zone-id: America/New_York
    holidays: []
    early-closes: []
    data-uncertain-dates: []
  pricing:
    tick-size: 0.01
    initial-buy-ticks: 0
    initial-sell-ticks: 0
    retry-buy-ticks: 1
    retry-sell-ticks: 1
    fee-pct: 0.25
    max-attempts: 3
    retry-wait-ms: 2000
  performance:
    backfill:
      default-days: 365
    holding-cost:
      symbols:
        QQQ: 0
        QLD: 0
        TQQQ: 0
  fx:
    yahoo:
      current-cache-ttl: 30s
      stale-success-ttl: 30m
      connect-timeout: 3s
      request-timeout: 5s
      history-cache-ttl: 365d
      history-cache-maximum-size: 1200
  operation:
    mode: PAPER
    auto-live-gate:
      required-consecutive-eod-success-days: 5
      require-zero-pending-orders: true
      require-zero-duplicate-signal-jobs: true
      require-manual-approval-record: true
    kpi:
      require-latest-eod-success: true
      max-duplicate-signal-jobs: 0
      max-unresolved-orders: 0
      max-order-failure-rate-pct: 5.0
    alerts:
      enabled: false
      dedupe-ttl-minutes: 30
      discord:
        enabled: false
        webhook-url: ${TRADING_DISCORD_WEBHOOK_URL:}
        min-severity: ERROR
        connect-timeout: ${TRADING_DISCORD_CONNECT_TIMEOUT:3s}
        request-timeout: ${TRADING_DISCORD_REQUEST_TIMEOUT:5s}
    risk-limits:
      max-order-notional-usd: 0
      max-daily-turnover-pct: 0
      max-retry-exposure-usd: 0
      max-slippage-pct: 0
  security:
    api-key: ${TRADING_API_KEY}
    public-path-prefixes: []
    public-path-protection-mode: UNSPECIFIED
    public-path-protection-note: ""
    public-read-allowed-origins: []
    public-rate-limit-per-minute: 60
    public-cache-max-age-seconds: 300
    public-client-ip-header: X-Forwarded-For
    public-trusted-proxy-ranges: []
    public-access-log-enabled: false
  scheduling:
    enabled: false
  execution:
    enabled: false
  strategy:
    tolerance-pct: 5.0
    symbols:
      - QQQ
      - QLD
      - TQQQ
    sell-priority:
      - TQQQ
      - QLD
      - QQQ
    buy-priority:
      - QQQ
      - QLD
      - TQQQ
    thresholds:
      drawdown:
        first: 15
        second: 25
        third: 35
        fourth: 45
      recovery:
        activation-max-drawdown-pct: 15
        recovery-drawdown-pct: 10
  circuit-breaker:
    enabled: true
    vix-enabled: true
    vix-threshold: 35
    ma-period: 200
