name: v2 CI

on:
  push:
    paths:
      - "v2/**"
      - "docs/v2-cutover/**"
      - "docs/templates/V2_FEATURE_PROPOSAL_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE/v2-feature.md"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew*"
      - "src/main/java/my/side/trading/adapter/in/scheduler/StrategyEodScheduler.java"
      - "src/main/java/my/side/trading/adapter/in/scheduler/RebalanceExecutionScheduler.java"
      - "src/main/java/my/side/trading/core/application/execution/RebalanceDecisionService.java"
      - "src/main/java/my/side/trading/core/application/orchestration/**"
      - "src/main/java/my/side/trading/core/application/strategy/**"
      - "src/main/java/my/side/trading/core/domain/strategy/**"
      - "src/main/java/my/side/trading/core/infrastructure/config/TradingCircuitBreakerProps.java"
      - "src/main/java/my/side/trading/core/infrastructure/config/TradingStrategyProps.java"
      - "src/main/java/my/side/trading/core/infrastructure/config/TradingStrategyThresholdProps.java"
      - "src/test/java/my/side/trading/adapter/in/scheduler/StrategyEodSchedulerTest.java"
      - "src/test/java/my/side/trading/adapter/in/scheduler/RebalanceExecutionSchedulerTest.java"
      - "src/test/java/my/side/trading/core/application/execution/RebalanceDecisionServiceTest.java"
      - "src/test/java/my/side/trading/core/application/orchestration/**"
      - "src/test/java/my/side/trading/core/application/strategy/**"
      - "src/test/resources/strategy-parity/**"
      - ".github/workflows/v2-ci.yml"
      - ".github/workflows/v2-release-candidate.yml"
  pull_request:
    paths:
      - "v2/**"
      - "docs/v2-cutover/**"
      - "docs/templates/V2_FEATURE_PROPOSAL_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE/v2-feature.md"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew*"
      - "src/main/java/my/side/trading/adapter/in/scheduler/StrategyEodScheduler.java"
      - "src/main/java/my/side/trading/adapter/in/scheduler/RebalanceExecutionScheduler.java"
      - "src/main/java/my/side/trading/core/application/execution/RebalanceDecisionService.java"
      - "src/main/java/my/side/trading/core/application/orchestration/**"
      - "src/main/java/my/side/trading/core/application/strategy/**"
      - "src/main/java/my/side/trading/core/domain/strategy/**"
      - "src/main/java/my/side/trading/core/infrastructure/config/TradingCircuitBreakerProps.java"
      - "src/main/java/my/side/trading/core/infrastructure/config/TradingStrategyProps.java"
      - "src/main/java/my/side/trading/core/infrastructure/config/TradingStrategyThresholdProps.java"
      - "src/test/java/my/side/trading/adapter/in/scheduler/StrategyEodSchedulerTest.java"
      - "src/test/java/my/side/trading/adapter/in/scheduler/RebalanceExecutionSchedulerTest.java"
      - "src/test/java/my/side/trading/core/application/execution/RebalanceDecisionServiceTest.java"
      - "src/test/java/my/side/trading/core/application/orchestration/**"
      - "src/test/java/my/side/trading/core/application/strategy/**"
      - "src/test/resources/strategy-parity/**"
      - ".github/workflows/v2-ci.yml"
      - ".github/workflows/v2-release-candidate.yml"

permissions:
  contents: read

jobs:
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment scripts and Compose config
        env:
          WALLANT_MYSQL_PASSWORD: ci-placeholder
          WALLANT_MYSQL_ROOT_PASSWORD: ci-root-placeholder
        run: |
          bash -n \
            v2/infra/scripts/bootstrap_staging.sh \
            v2/infra/scripts/configure_access_staging.sh \
            v2/infra/scripts/configure_cloudflare_tunnel.sh \
            v2/infra/scripts/preflight_staging.sh \
            v2/infra/scripts/preflight_access_staging.sh \
            v2/infra/scripts/deploy_staging.sh \
            v2/infra/tests/release_switch_test.sh \
            v2/infra/tests/deploy_staging_fault_injection_test.sh \
            v2/infra/tests/documentation_contract_test.sh
          bash v2/infra/tests/release_switch_test.sh
          bash v2/infra/tests/deploy_staging_fault_injection_test.sh
          bash v2/infra/tests/documentation_contract_test.sh
          docker compose -f v2/infra/compose.yaml config --quiet
          grep -F \
            'ExecStart=/opt/wallant/current/venv/bin/python -m uvicorn' \
            v2/infra/systemd/wallant-v2-api.service
          grep -F \
            'EnvironmentFile=/opt/wallant/current/release.env' \
            v2/infra/systemd/wallant-v2-api.service
          grep -F \
            "printf 'WALLANT_BUILD_SHA=%s\\n'" \
            v2/infra/scripts/deploy_staging.sh
          grep -F -- \
            '--token-file %d/tunnel-token' \
            v2/infra/systemd/wallant-v2-cloudflared.service
          grep -F \
            'LoadCredential=tunnel-token:/etc/wallant/cloudflared.token' \
            v2/infra/systemd/wallant-v2-cloudflared.service
          grep -F 'http://127.0.0.1:18082' v2/infra/Caddyfile.staging.example
          grep -F 'http://app.wall-ant.com:18082' v2/infra/Caddyfile.staging.example
          grep -F 'bind 127.0.0.1' v2/infra/Caddyfile.staging.example
          venv_test_root="$(mktemp -d)"
          python3 -m venv "${venv_test_root}/release.incoming/venv"
          mv "${venv_test_root}/release.incoming" "${venv_test_root}/release"
          "${venv_test_root}/release/venv/bin/python" -c 'import sys; print(sys.prefix)'

  # PR/push 피드백용이며 RC가 배포 대상 SHA에서 동일 테스트를 의도적으로 재실행한다.
  legacy-strategy-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Verify Java/Python QQQM strategy parity and Java scheduler contracts
        run: >-
          bash gradlew test
          --tests my.side.trading.core.application.strategy.QqqmJavaPythonGoldenParityTest
          --tests my.side.trading.adapter.in.scheduler.StrategyEodSchedulerTest
          --tests my.side.trading.adapter.in.scheduler.RebalanceExecutionSchedulerTest

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: >-
          pytest
          -W error
          -W "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning"
          --cov=wallant
          --cov-fail-under=80
      - run: |
          migration_db="$(mktemp /tmp/wallant-migration-XXXXXX.db)"
          WALLANT_ENVIRONMENT=test \
          WALLANT_DATABASE_URL="sqlite+pysqlite:///$migration_db" \
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Install ACL inspection dependency
        run: sudo apt-get update && sudo apt-get install -y acl
      - run: npm test
      - run: npm run build

  # 빠른 mock-only 회귀 검사용이며 RC는 manifest 안전 필드까지 독립 검증한다.
  ui-qa:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json
      - run: npm ci
      - name: Install deterministic browser runtime
        run: npx playwright install --with-deps chromium
      - name: Verify deployed screenshot confidentiality mask
        run: npm run test:e2e:masking
      - name: Verify the non-mutating v2 planning board
        run: npm run test:e2e:planning
      - name: Run zero-real-order UI QA
        env:
          QA_GIT_SHA: ${{ github.sha }}
          QA_ENVIRONMENT: github-actions-local-mock
        run: npm run test:e2e
      - name: Upload UI QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-ui-qa-local-mock-${{ github.run_attempt }}
          path: v2/frontend/artifacts/playwright/verified
          if-no-files-found: warn
          retention-days: 30
      - name: Upload planning board QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-planning-board-qa-${{ github.run_attempt }}
          path: v2/frontend/artifacts/planning-board
          if-no-files-found: warn
          retention-days: 30
